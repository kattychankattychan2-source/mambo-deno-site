<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mambo Site</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🐴 Mambo Site 🐴</h1>
        <button class="mambo-button" id="mamboBtn">Just Click</button>
        
        <div id="mamboContainer" class="mambo-container hidden">
            <img id="mamboGif" src="mambo.gif" alt="Mambo" class="mambo-gif">
            <p class="mambo-text">Mambo!</p>
        </div>
    </div>
    
    <audio id="mamboSound" src="mambo-sound.mp3"></audio>
    <script src="script.js"></script>
</body>
</html>
